<title>FisioAI</title>
<style>
/* Layout: sidebar on desktop, bottom tab bar on phones; one content column, summary first.
   Palette: cool slate neutrals + sea-teal accent; green/amber/red are reserved for pain level and appointment status.
   Type: system stacks only (no external dependencies): rounded display, system body, mono for clinical numbers. */
:root{
  --bg:#f1f5f7;--surface:#ffffff;--surface-2:#e8eef1;--ink:#12212a;--ink-2:#4a5d69;--ink-3:#73858f;--line:#d5dfe5;
  --accent:#0a7f86;--accent-ink:#ffffff;--accent-soft:#d5edef;
  --good:#17794a;--good-soft:#daf0e4;--warn:#955d06;--warn-soft:#f8ebcf;--bad:#b3301f;--bad-soft:#f8dcd8;
  --overlay:rgba(8,16,20,.55);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d161b;--surface:#142027;--surface-2:#1b2b34;--ink:#e4edf1;--ink-2:#9fb2bd;--ink-3:#6f838e;--line:#263842;
    --accent:#3ec1c8;--accent-ink:#04252a;--accent-soft:#123a3f;
    --good:#4fc78b;--good-soft:#133425;--warn:#e2b255;--warn-soft:#3a2f12;--bad:#f0806f;--bad-soft:#3d1c18;
    --overlay:rgba(0,0,0,.65);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d161b;--surface:#142027;--surface-2:#1b2b34;--ink:#e4edf1;--ink-2:#9fb2bd;--ink-3:#6f838e;--line:#263842;
  --accent:#3ec1c8;--accent-ink:#04252a;--accent-soft:#123a3f;
  --good:#4fc78b;--good-soft:#133425;--warn:#e2b255;--warn-soft:#3a2f12;--bad:#f0806f;--bad-soft:#3d1c18;
  --overlay:rgba(0,0,0,.65);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}

/* shell */
.shell{min-height:100vh}
.side{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:-.02em}
.brand svg{flex:none}
.brand small{display:block;font:500 11px/1.3 var(--sans);letter-spacing:.04em;color:var(--ink-3);margin-top:3px}
.main{padding:16px 16px 104px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;min-height:48px}
.tab[aria-current="page"]{color:var(--accent)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:22px;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .topbar,.tabbar{display:none}
  .main{padding:32px clamp(24px,4vw,48px) 56px}
  .side .foot{margin-top:auto;font-size:12px;color:var(--ink-3)}
}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* headings */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 28px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
h1 small{display:block;font:500 14px/1.4 var(--sans);letter-spacing:0;color:var(--ink-2);margin-top:4px;text-transform:capitalize}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2,.sech h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--ink-3);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link{border:0;background:none;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.link:hover{color:var(--accent);text-decoration:underline}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=range]{padding:0;min-height:32px;accent-color:var(--accent);border:0;background:none}
select.status{width:auto;min-height:34px;padding:4px 10px;font-size:13px;font-weight:600;border-radius:999px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 220px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600}
button.chip{border:1px solid transparent;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chipcb{position:relative;display:inline-block}
.chipcb input{position:absolute;opacity:0;inset:0;width:100%;min-height:0;cursor:pointer}
.chipcb span{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.chipcb input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chipcb input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.good,select.status.realizado{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad,select.status.faltou{background:var(--bad-soft);color:var(--bad)}
.pill.acc,select.status.confirmado{background:var(--accent-soft);color:var(--accent)}
select.status.agendado,select.status.cancelado{background:var(--surface-2);color:var(--ink-2)}
select.status{border-color:transparent}
.pain{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.pain i{font-style:normal;opacity:.6}
.pain.good{background:var(--good-soft);color:var(--good)}
.pain.warn{background:var(--warn-soft);color:var(--warn)}
.pain.bad{background:var(--bad-soft);color:var(--bad)}

/* data blocks */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat b{display:block;font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:13px}
.rows{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--surface-2)}
.grow{flex:1 1 180px;min-width:0}
.time{min-width:64px;font:600 15px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.time small{display:block;font:500 11px/1.4 var(--sans);color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}
.dot.bad{background:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.warn i{background:var(--warn)}
.prog{display:flex;flex-direction:column;gap:4px;min-width:96px;font-size:12px;color:var(--ink-2)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);text-align:center;background:var(--surface)}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:62px}
.wd small{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.wd b{font:700 17px/1.1 var(--display)}
.wd em{font-style:normal;font-size:11px;color:var(--ink-3)}
.wd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd[aria-pressed="true"] small,.wd[aria-pressed="true"] em{color:var(--accent-ink)}
.wd.today:not([aria-pressed="true"]) b{color:var(--accent)}

/* patient */
.phead{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.phead .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.meta div{min-width:0}
.meta span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.meta b{font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chartbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 14px 8px}
.chartscroll{overflow-x:auto}
.chartscroll svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:18px;height:0;border-top:3px solid var(--accent)}
.lg.l2{border-top:2px dashed var(--ink-2)}
.gl{stroke:var(--line);stroke-width:1}
.tk{fill:var(--ink-3);font:11px var(--mono)}
.ln1{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.pt1{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.pt2{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.evol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.evol header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.evol header h3{font:700 16px/1.3 var(--display);flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.soap{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.soap b{font:700 13px/1.6 var(--mono);color:var(--accent)}
.soap p{white-space:pre-wrap;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:12px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:660px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.mh h3{font:700 20px/1.2 var(--display);letter-spacing:-.01em}
.mh small{display:block;font:500 13px/1.4 var(--sans);color:var(--ink-2);letter-spacing:0}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:100%;padding:22px}}
.painrow{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:10px;align-items:center}
.painrow output{font:700 20px/1 var(--mono);text-align:right}
.romrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px}
.hint{font-size:12px;color:var(--ink-3)}
textarea.code{font:12px/1.5 var(--mono);min-height:120px;word-break:break-all}
.credit{margin-top:6px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--ink-3);text-align:center;overflow-wrap:anywhere}
.credit a{color:var(--accent);font-weight:600;text-decoration:none}
.credit a:hover{text-decoration:underline}
.onb{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.onb form{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.exurl{color:var(--accent);overflow-wrap:anywhere;font-size:13px}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 var(--sans);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return fmtISO(d);};
const todayISO=()=>fmtISO(new Date());
const fmtBR=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const fmtShort=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);
const toMin=t=>{const a=String(t).split(':');return (+a[0])*60+(+a[1]||0);};
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
function ageOf(birth){if(!birth)return null;const b=parseISO(birth),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
function mondayOf(iso){const d=parseISO(iso);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return fmtISO(d);}

const ICONS={
  hoje:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pacientes:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.7 3.2 2.3 3.5 5.2"/>',
  dados:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9M10 13h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  left:'<path d="M15 6l-6 6 6 6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  exercicios:'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>',
  send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'
};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- domain constants ---------- */
const STATUS={agendado:'Agendado',confirmado:'Confirmado',realizado:'Realizado',faltou:'Faltou',cancelado:'Cancelado'};
const TYPES=['Sessão','Avaliação','Reavaliação','Retorno'];
const CONDUCTS=[['cinesio','Cinesioterapia'],['manual','Terapia manual'],['alongamento','Alongamento'],['fortalec','Fortalecimento'],['eletro','Eletroterapia'],['crio','Crioterapia'],['termo','Termoterapia'],['marcha','Treino de marcha'],['equilibrio','Treino de equilíbrio'],['orient','Orientações domiciliares']];
const CMAP={};CONDUCTS.forEach(c=>CMAP[c[0]]=c[1]);
const MOVES=['Flexão de joelho','Extensão de joelho','Flexão de ombro','Abdução de ombro','Rotação lateral de ombro','Flexão de quadril','Dorsiflexão de tornozelo','Flexão de cotovelo','Flexão cervical'];
const REGIONS=['Coluna cervical','Coluna torácica','Coluna lombar','Ombro','Cotovelo','Punho e mão','Quadril','Joelho','Tornozelo e pé','Neurológico','Respiratório'];
const painCls=v=>v<=3?'good':v<=6?'warn':'bad';
const painBadge=(b,a)=>'<span class="pain '+painCls(a)+'" title="EVA: início → fim"><span class="mono">'+b+'</span><i>→</i><span class="mono">'+a+'</span></span>';

/* ---------- draft of O / A / P ---------- */
function buildDraft(x){
  const O=[],A=[],P=[];
  O.push('EVA '+x.pb+'/10 no início e '+x.pa+'/10 ao final da sessão.');
  if(x.rom.length)O.push('ADM: '+x.rom.map(r=>r.mov+' '+r.deg+'°').join('; ')+'.');
  const names=x.conducts.map(k=>CMAP[k]||k).filter(Boolean);
  if(names.length)O.push('Procedimentos: '+names.map((s,i)=>i?s.toLowerCase():s).join(', ')+'.');
  const d=x.pb-x.pa;
  if(d>=3)A.push('Redução de '+d+' pontos na EVA durante a sessão, com boa resposta imediata às condutas.');
  else if(d>=1)A.push('Redução parcial da dor ('+d+(d===1?' ponto':' pontos')+' na EVA) ao final da sessão.');
  else if(d===0)A.push('Sem variação da dor ao longo da sessão.');
  else A.push('Aumento da dor na sessão ('+(-d)+(d===-1?' ponto':' pontos')+' na EVA); revisar dosagem e escolha das condutas.');
  if(x.prev){
    const t=x.pb<x.prev.painBefore?'menor':x.pb>x.prev.painBefore?'maior':'igual';
    A.push('EVA inicial '+t+' que na sessão anterior ('+x.prev.painBefore+'/10).');
    x.rom.forEach(r=>{

const CRC_T=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  let cs=0;central.forEach(c=>{cs+=c.length;});
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);end.setUint16(20,0,true);
  return new Blob(parts.concat(central,[new Uint8Array(end.buffer)]),{type:'application/zip'});
}
function downloadZip(files){
  const enc=new TextEncoder();
  const list=files.map(f=>({name:'FisioAI/'+(f.dir?f.dir+'/':'')+f.name,data:enc.encode(f.raw?f.text:'﻿'+f.text)}));
  const url=URL.createObjectURL(makeZip(list)),a=document.createElement('a');
  a.href=url;a.download='FisioAI-backup-'+todayISO()+'.zip';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function cleanOld(dir){
  try{
    const old=[];
    for await(const ent of dir.entries()){if(ent[1].kind==='file'&&/^\d{2,} - (Avaliação inicial|Evolução) \(/.test(ent[0]))old.push(ent[0]);}
    for(const n of old)await dir.removeEntry(n);
  }catch(e){}
}
async function writeToDir(root,files){
  const top=await root.getDirectoryHandle('FisioAI',{create:true}),dirs={};
  for(const f of files){
    let dir=top;
    if(f.dir){if(!dirs[f.dir]){dirs[f.dir]=await top.getDirectoryHandle(f.dir,{create:true});await cleanOld(dirs[f.dir]);}dir=dirs[f.dir];}
    const fh=await dir.getFileHandle(f.name,{create:true}),w=await fh.createWritable();
    await w.write(f.raw?f.text:'﻿'+f.text);await w.close();
  }
}
async function doBackup(){
  const json=backupJSON();
  let copied=false;
  const clip=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(json).then(()=>{copied=true;},()=>{}):Promise.resolve();
  if(window.top!==window.self){await clip;toast(copied?'Código copiado. Para criar a pasta, abra o arquivo FisioAI.html no seu computador.':'Para criar a pasta, abra o arquivo FisioAI.html no seu computador.');return;}
  const files=buildFiles();files.push({dir:'',name:'backup-restauracao.json',text:json,raw:true});

    }else{downloadZip(files);how='zip';}
  }catch(err){
    if(err&&err.name==='AbortError'){await clip;toast(copied?'Pasta não criada. O código foi copiado.':'Pasta não criada.');return;}
    try{downloadZip(files);how='zip';}catch(e2){await clip;toast('Não foi possível salvar a pasta.'+(copied?' O código foi copiado.':''));return;}
  }
  await clip;
  S.lastBackup=new Date().toISOString();save();render();

}

function painChart(ev){
  const pts=ev.slice(-12);
  if(pts.length<2)return '<div class="empty">O gráfico de dor aparece a partir da segunda evolução.</div>';
  const W=640,H=230,L=34,R=16,T=14,B=34,iw=W-L-R,ih=H-T-B,n=pts.length;
  const x=i=>L+i*iw/(n-1),y=v=>T+(10-v)/10*ih;
  let g='';
  for(let v=0;v<=10;v+=2)g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tk" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const step=Math.ceil(n/6);
  pts.forEach((e,i)=>{if((i%step===0&&(n-1-i>=step))||i===n-1)g+='<text class="tk" x="'+x(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+fmtShort(e.date)+'</text>';});
  const path=k=>pts.map((e,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(e[k]).toFixed(1)).join(' ');
  g+='<path class="ln2" d="'+path('painAfter')+'"/><path class="ln1" d="'+path('painBefore')+'"/>';
  pts.forEach((e,i)=>{
    g+='<circle class="pt2" cx="'+x(i).toFixed(1)+'" cy="'+y(e.painAfter).toFixed(1)+'" r="3.5"><title>'+fmtBR(e.date)+': EVA ao final '+e.painAfter+'/10</title></circle>';
    g+='<circle class="pt1" cx="'+x(i).toFixed(1)+'" cy="'+y(e.painBefore).toFixed(1)+'" r="4"><title>'+fmtBR(e.date)+': EVA no início '+e.painBefore+'/10</title></circle>';
  });
  const first=pts[0],last=pts[n-1];
  return '<div class="chartbox"><div class="legend"><span><i class="lg"></i>EVA no início</span><span><i class="lg l2"></i>EVA ao final</span><span class="mono">Início: '+first.painBefore+' → '+last.painBefore+' (de '+fmtShort(first.date)+' a '+fmtShort(last.date)+')</span></div>'+
    '<div class="chartscroll"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução da dor por sessão, escala EVA de 0 a 10">'+g+'</svg></div></div>';
}

   '<div><label class="lbl" for="ay">Tipo</label><select id="ay" name="type">'+TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'+
   '<div class="full"><label class="lbl" for="ar">Repetir toda semana por quantas semanas</label><input id="ar" type="number" min="1" max="52" name="rep" value="1"><div class="hint">1 marca apenas esta consulta. Valores maiores criam uma consulta por semana, no mesmo dia e horário.</div></div>'+
  '</div><div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary" type="submit">Marcar</button></div></form>';
}
function fEvol(m){
  const p=P(m.pid);if(!p)return '';
  const n=evolsOf(p.id).length+1;
  const rows=[0,1,2].map(i=>'<div class="romrow"><input name="mov'+i+'" list="moves" placeholder="Movimento" aria-label="Movimento '+(i+1)+'"><input name="deg'+i+'" type="number" step="1" min="-90" max="360" placeholder="Graus" aria-label="Graus '+(i+1)+'"></div>').join('');
  return '<form id="f-evol" data-id="'+p.id+'">'+head('Nova evolução','Sessão '+n+' de '+esc(p.name))+'<div class="fgrid">'+
   '<div class="full"><label class="lbl" for="ed">Data</label><input id="ed" type="date" name="date" required value="'+esc(m.date||todayISO())+'"></div>'+
   '<div class="full"><span class="lbl">Como prefere registrar?</span><div class="chips"><label class="chipcb"><input type="radio" name="mode" value="soap" checked><span>Estruturada (S O A P)</span></label><label class="chipcb"><input type="radio" name="mode" value="free"><span>Evolução completa por escrito</span></label></div></div>'+
   '<div><label class="lbl" for="eb">EVA no início (0 a 10)</label><div class="painrow"><input id="eb" type="range" name="pb" min="0" max="10" value="5" data-out="ob1"><output id="ob1" class="pain warn">5</output></div></div>'+
   '<div><label class="lbl" for="ea">EVA ao final (0 a 10)</label><div class="painrow"><input id="ea" type="range" name="pa" min="0" max="10" value="3" data-out="oa1"><output id="oa1" class="pain good">3</output></div></div>'+
   '<div class="full" id="evsoap"><div class="fgrid">'+
   '<div class="full"><span class="lbl">Condutas realizadas</span><div class="chips">'+CONDUCTS.map(c=>'<label class="chipcb"><input type="checkbox" name="c" value="'+c[0]+'"><span>'+c[1]+'</span></label>').join('')+'</div><label class="lbl" for="cx" style="margin-top:10px">Outras condutas (digite, separando por vírgula)</label><input id="cx" name="cx" placeholder="Ex.: Mobilização neural, Bandagem funcional"></div>'+
   '<div class="full"><span class="lbl">Amplitude de movimento (goniometria, em graus)</span><div class="list" style="gap:8px">'+rows+'</div><datalist id="moves">'+MOVES.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist></div>'+
   '<div class="full"><label class="lbl" for="eS">S · Subjetivo (relato do paciente)</label><textarea id="eS" name="S" data-focus></textarea></div>'+
   '<div class="full"><button type="button" class="btn sm" data-a="draft">Montar rascunho de O, A e P</button><div class="hint" style="margin-top:6px">Monta os textos a partir de dor, amplitude e condutas acima. Revise e ajuste antes de salvar, a avaliação clínica é sua.</div></div>'+
   '<div class="full"><label class="lbl" for="eO">O · Objetivo</label><textarea id="eO" name="O"></textarea></div>'+
   '<div class="full"><label class="lbl" for="eA">A · Avaliação</label><textarea id="eA" name="A"></textarea></div>'+
   '<div class="full"><label class="lbl" for="eP">P · Plano</label><textarea id="eP" name="P"></textarea></div>'+
  '</div></div><div class="full" id="evfree" hidden><label class="lbl" for="ef">Evolução completa</label><textarea id="ef" name="free" style="min-height:260px" placeholder="Escreva aqui a evolução da sessão: relato do paciente, condutas, resposta ao tratamento, plano."></textarea></div>'+
   '</div><div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary" type="submit">Salvar evolução</button></div></form>';
}
function fConfirm(m){
  return head(esc(m.title))+'<p class="muted">'+esc(m.msg)+'</p><div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn danger" data-a="confirm-yes" style="background:var(--bad-soft)">'+esc(m.yes||'Excluir')+'</button></div>';
}
function vModal(){
  const m=U.modal;if(!m)return '';
  const b=m.type==='patient'?fPatient(m):m.type==='appt'?fAppt(m):m.type==='evol'?fEvol(m):m.type==='profile'?fProfile():fConfirm(m);
  return '<div class="overlay" data-a="close-bg"><div class="sheet" role="dialog" aria-modal="true">'+b+'</div></div>';
}

/* ---------- shell / render ---------- */
const NAV=[['hoje','Hoje'],['agenda','Agenda'],['pacientes','Pacientes'],['exercicios','Exercícios'],['dados','Dados']];
const LOGO='<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--accent)"/><path d="M6 18h5l3-8 5 15 3-9 2 2h4" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CREDIT='<footer class="credit">Sistema criado pelo fisioterapeuta Marcos Dias · CREFITO 7 - 463571-F · <a href="https://www.instagram.com/doutormarcosdias" target="_blank" rel="noopener">@doutormarcosdias</a></footer>';
const BRAND='<div class="brand">'+LOGO+'<div>FisioAI<small>Gestão para fisioterapeutas</small></div></div>';
function render(){
  if(!S.profile){$('#app').innerHTML=vOnboard();const f=$('#un');if(f)setTimeout(()=>{try{f.focus({preventScroll:true});}catch(e){}},30);return;}
  const cur=U.view==='paciente'?'pacientes':U.view==='exfolder'?'exercicios':U.view;
  const nav=NAV.map(n=>'<button class="navbtn" data-a="nav" data-id="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+ic(n[0])+n[1]+'</button>').join('');
  const tabs=NAV.map(n=>'<button class="tab" data-a="nav" data-id="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+ic(n[0])+n[1]+'</button>').join('');
  const v=U.view==='hoje'?vHoje():U.view==='agenda'?vAgenda():U.view==='pacientes'?vPacientes():U.view==='paciente'?vPaciente():U.view==='exercicios'?vExercicios():U.view==='exfolder'?vExFolder():vDados();
  $('#app').innerHTML='<div class="shell"><aside class="side">'+BRAND+'<nav aria-label="Principal">'+nav+'</nav><div class="foot">Dados guardados só neste navegador.</div></aside>'+
    '<div><div class="topbar">'+BRAND+'</div><main class="main"><div class="wrap">'+v+CREDIT+'</div></main></div>'+
    '<nav class="tabbar" aria-label="Principal">'+tabs+'</nav></div>'+vModal();
  if(U.modal){const f=$('.sheet [data-focus]');if(f&&f.tagName!=='SELECT')setTimeout(()=>{try{f.focus({preventScroll:true});}catch(e){}},30);}
}
let tt;
function toast(msg){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2400);}
function go(view,pid){U.view=view;U.pid=pid||null;U.modal=null;render();window.scrollTo(0,0);}
function confirmBox(title,msg,act,id,yes){U.modal={type:'confirm',title:title,msg:msg,act:act,id:id,yes:yes};render();}

/* ---------- events ---------- */
const app=$('#app');
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  if(a==='close-bg'){if(e.target===el){U.modal=null;render();}return;}
  if(a==='open-patient'){e.stopPropagation();U.tab='evol';go('paciente',id);return;}
  switch(a){
    case 'nav':go(id);break;
    case 'tab':U.tab=id;render();break;
    case 'filter':U.filter=id;render();break;
    case 'day-set':U.day=id;render();break;
    case 'week-prev':U.day=addDays(U.day,-7);render();break;
    case 'week-next':U.day=addDays(U.day,7);render();break;
    case 'day-today':U.day=todayISO();render();break;
    case 'new-patient':U.modal={type:'patient'};render();break;
    case 'edit-patient':U.modal={type:'patient',id:id};render();break;
    case 'new-appt':U.modal={type:'appt',date:id||(U.view==='agenda'?U.day:todayISO()),pid:U.view==='paciente'?U.pid:null};render();break;
    case 'new-evol':U.modal={type:'evol',pid:id,date:todayISO()};render();break;
    case 'appt-evol':{const ap=S.appts.find(x=>x.id===id);if(ap){U.modal={type:'evol',pid:ap.patientId,date:ap.date};render();}break;}
    case 'toggle-alta':{const p=P(id);if(p){p.status=p.status==='alta'?'ativo':'alta';save();render();toast(p.status==='alta'?'Paciente com alta':'Tratamento reativado');}break;}
    case 'del-patient':{const p=P(id);if(p)confirmBox('Excluir paciente','Todos os dados de '+p.name+' serão apagados: cadastro, avaliação, evoluções, consultas e exercícios. Esta ação não pode ser desfeita.','del-patient',id,'Excluir paciente');break;}
    case 'del-appt':confirmBox('Excluir consulta','Esta consulta será removida da agenda.','del-appt',id);break;
    case 'del-evol':confirmBox('Excluir evolução','A evolução será removida do prontuário e do gráfico de dor.','del-evol',id);break;
    case 'ask-examples':confirmBox('Remover dados de exemplo','Os pacientes, consultas e evoluções fictícios serão apagados. O que você cadastrou continua.','examples',null,'Remover');break;
    case 'ask-wipe':confirmBox('Apagar todos os dados','Todos os pacientes, consultas e evoluções serão apagados deste navegador. Copie o backup antes se precisar.','wipe',null,'Apagar tudo');break;
    case 'edit-profile':U.modal={type:'profile'};render();break;
    case 'open-ex':go('exfolder',id);break;
    case 'del-ex':confirmBox('Excluir exercício','O exercício será removido desta pasta.','del-ex',id);break;
    case 'send-ex':{const p=P(id);if(!p)break;if(!exOf(id).length){toast('Adicione ao menos um exercício antes de enviar.');break;}waOpen(p.phone,exMsg(p));break;}
    case 'wa-confirm':{
      const ap=S.appts.find(x=>x.id===id),p=ap&&P(ap.patientId);if(!p)break;
      if(!waPhone(p.phone)){U.modal={type:'patient',id:p.id};render();toast('Cadastre o WhatsApp de '+p.name+' para enviar.');break;}
      waOpen(p.phone,apptMsg(ap,p));
      if(ap.status==='agendado'){ap.status='confirmado';save();render();toast('Agendamento confirmado');}
      break;
    }
    case 'close':U.modal=null;render();break;
    case 'confirm-yes':{
      const m=U.modal;U.modal=null;
      if(m.act==='del-appt')S.appts=S.appts.filter(x=>x.id!==m.id);
      else if(m.act==='del-evol')S.evols=S.evols.filter(x=>x.id!==m.id);
      else if(m.act==='del-patient'){S.patients=S.patients.filter(x=>x.id!==m.id);S.appts=S.appts.filter(x=>x.patientId!==m.id);S.evols=S.evols.filter(x=>x.patientId!==m.id);S.exercises=S.exercises.filter(x=>x.patientId!==m.id);U.view='pacientes';U.pid=null;}
      else if(m.act==='del-ex')S.exercises=S.exercises.filter(x=>x.id!==m.id);
      else if(m.act==='examples'){S.patients=S.patients.filter(x=>!x.example);S.appts=S.appts.filter(x=>!x.example&&P(x.patientId));S.evols=S.evols.filter(x=>!x.example&&P(x.patientId));S.exercises=S.exercises.filter(x=>P(x.patientId));if((U.view==='paciente'||U.view==='exfolder')&&!P(U.pid)){U.view='pacientes';}}
      else if(m.act==='wipe'){S={profile:S.profile,patients:[],appts:[],evols:[],exercises:[]};U.view='hoje';}
      save();render();toast('Pronto');break;
    }
    case 'draft':{
      const f=$('#f-evol');if(!f)break;
      const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim();
      const rom=[];for(let i=0;i<3;i++){const mov=g('mov'+i),deg=parseFloat(g('deg'+i));if(mov&&!isNaN(deg))rom.push({mov:mov,deg:deg});}
      const pid=f.dataset.id,p=P(pid),ev=evolsOf(pid),date=g('date')||todayISO();
      const before=ev.filter(x=>x.date<=date),prev=before[before.length-1]||null;
      const dr=buildDraft({pb:+fd.get('pb'),pa:+fd.get('pa'),rom:rom,conducts:condsOf(fd),n:ev.length+1,planned:+p.planned||0,prev:prev});
      f.elements.O.value=dr.O;f.elements.A.value=dr.A;f.elements.P.value=dr.P;
      toast('Rascunho montado. Revise antes de salvar.');break;
    }
    case 'backup':doBackup();break;
    case 'copy-backup':{
      const ta=$('#bk');ta.focus();ta.select();
      const ok=()=>toast('Backup copiado');
      const fail=()=>toast('Texto selecionado. Use Ctrl+C para copiar.');
      try{navigator.clipboard.writeText(ta.value).then(ok,fail);}catch(err){fail();}
      break;
    }
  }
});
app.addEventListener('change',e=>{
  if(e.target.name==='mode'){const fr=e.target.value==='free';const a=$('#evsoap'),b=$('#evfree');if(a)a.hidden=fr;if(b)b.hidden=!fr;return;}
  if(e.target.id==='impf'){
    const fl=e.target.files&&e.target.files[0];if(!fl)return;
    const r=new FileReader();
    r.onload=()=>{const ta=$('#imp');if(ta)ta.value=String(r.result).replace(/^\uFEFF/,'');toast('Arquivo carregado. Toque em Restaurar backup para aplicar.');};
    r.readAsText(fl);return;
  }
  const el=e.target.closest('[data-change]');if(!el)return;
  if(el.dataset.change==='appt-status'){
    const ap=S.appts.find(x=>x.id===el.dataset.id);if(ap){ap.status=el.value;save();render();}
  }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){U.q=t.value;$('#plist').innerHTML=plist();return;}
  if(t.dataset&&t.dataset.out){const o=$('#'+t.dataset.out);if(o){o.textContent=t.value;o.className='pain '+painCls(+t.value);}}
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,fd=new FormData(f),g=k=>String(fd.get(k)==null?'':fd.get(k)).trim();
  if(f.id==='f-onboard'||f.id==='f-profile'){
    const name=g('name'),cr=g('crefito');if(!name||!cr)return;
    S.profile={name:name,title:g('title'),crefito:/crefito/i.test(cr)?cr:'CREFITO '+cr};
    U.modal=null;save();render();toast(f.id==='f-onboard'?'Perfil criado':'Perfil salvo');
  }else if(f.id==='f-ex'){
    const pid=f.dataset.id,name=g('name');let url=g('url');if(!pid||!name)return;
    if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
    S.exercises.push({id:uid(),patientId:pid,name:name,url:url,ts:Date.now()});
    save();render();toast('Exercício adicionado');const n=$('#exn');if(n)n.focus();
  }else if(f.id==='f-patient'){
    const name=g('name');if(!name)return;
    const data={name:name,birth:g('birth'),phone:g('phone'),dx:g('dx'),region:g('region'),plan:g('plan'),planned:Math.max(0,parseInt(g('planned'),10)||0),notes:g('notes')};
    if(f.dataset.id){const p=P(f.dataset.id);Object.assign(p,data);if(g('status'))p.status=g('status');U.modal=null;save();render();toast('Dados salvos');}
    else{const p=Object.assign({id:uid(),status:'ativo',created:todayISO(),avalDate:todayISO(),anamnese:'',objetivos:''},data);S.patients.push(p);save();U.tab='aval';go('paciente',p.id);toast('Paciente cadastrado');}
  }else if(f.id==='f-appt'){
    const pid=g('pid'),date=g('date'),time=g('time');if(!pid||!date||!time)return;
    const dur=parseInt(g('dur'),10)||50,type=g('type')||'Sessão',rep=Math.max(1,Math.min(52,parseInt(g('rep'),10)||1));
    for(let i=0;i<rep;i++)S.appts.push({id:uid(),patientId:pid,date:addDays(date,7*i),time:time,dur:dur,type:type,status:'agendado'});
    U.modal=null;if(U.view==='agenda')U.day=date;save();render();toast(rep>1?rep+' consultas marcadas':'Consulta marcada');
  }else if(f.id==='f-evol'){
    const pid=f.dataset.id,date=g('date');if(!pid||!date)return;
    const rom=[];for(let i=0;i<3;i++){const mov=g('mov'+i),deg=parseFloat(g('deg'+i));if(mov&&!isNaN(deg))rom.push({mov:mov,deg:deg});}
    const fr=g('mode')==='free';if(fr&&!g('free')){toast('Escreva a evolução no campo de texto.');return;}
    S.evols.push({id:uid(),patientId:pid,date:date,painBefore:+fd.get('pb'),painAfter:+fd.get('pa'),rom:fr?[]:rom,conducts:fr?[]:condsOf(fd),S:fr?'':g('S'),O:fr?'':g('O'),A:fr?'':g('A'),P:fr?'':g('P'),free:fr?g('free'):'',ts:Date.now()});
    U.modal=null;save();
    if(U.view!=='paciente'||U.pid!==pid){U.tab='evol';go('paciente',pid);}else{U.tab='evol';render();}
    toast('Evolução salva');
  }else if(f.id==='f-eval'){
    const p=P(f.dataset.id);if(!p)return;
    p.avalDate=g('avalDate');p.anamnese=g('anamnese');p.objetivos=g('objetivos');save();toast('Avaliação salva');
  }else if(f.id==='f-import'){
    let d=null;try{d=JSON.parse(g('json'));}catch(err){}
    if(!d||!Array.isArray(d.patients)||!Array.isArray(d.appts)||!Array.isArray(d.evols)){toast('Backup inválido. Cole o texto completo.');return;}
    S={profile:d.profile||S.profile,patients:d.patients,appts:d.appts,evols:d.evols,exercises:Array.isArray(d.exercises)?d.exercises:[]};U.pid=null;save();render();toast('Backup restaurado');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.modal){U.modal=null;render();}});

render();
})();
</script>
